# Extension libraries loading
shared_preload_libraries = 'pg_stat_statements'

# Connection settings
listen_addresses = '0.0.0.0'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# Memory
shared_buffers = 128MB
work_mem = 8MB

# Compute the max amount of mem the DB hash-based operations (passing ids to hash functions to locate data bucket) can use
# by multiplying value of work_mem to set the top mem limit of hash-based operations
# for example: a single hash join/aggregation can consume up to 8 MB of RAM
hash_mem_multiplier = 2.0

# Max amount of mem for maintenance ops like auto vacumm
# This value can be multiplied by autovacuum_max_workers
maintenance_work_mem = 16MB

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = 'INFO'
log_error_verbosity = 'DEFAULT'
log_connections = on
log_disconnections = on
log_hostname = off

# pg_stat_statements extension library
compute_query_id = on
pg_stat_statements.max = 10000
pg_stat_statements.track = all
