# -- Global host path prefixes (centralized to avoid duplication)
paths:
  config: /home/hong/k8s-data
  seagate: /home/hong/Media/SeagateExpansion/Torrents
  westernDigital: /home/hong/Media/WesternDigital/Torrents

# -- Common environment variables for linuxserver images
linuxserver:
  puid: "1000"
  pgid: "1000"
  tz: "Etc/UTC"

# -- Namespace definitions
namespaces:
  - torrents
  - media
  - server
  - tools
  - infra
  - monitoring

# -- qBittorrent (torrents namespace)
qbittorrent:
  enabled: true
  image: lscr.io/linuxserver/qbittorrent:4.6.7
  webuiPort: 8080
  nodePort: 30082
  torrentPort: 6881
  torrentNodePort: 30881
  volumes:
    downloads: /downloads
    media: /media

# -- Radarr (torrents namespace)
radarr:
  enabled: true
  image: lscr.io/linuxserver/radarr:latest
  port: 7878
  nodePort: 30878
  volumes:
    downloads: /downloads

# -- Sonarr (torrents namespace)
sonarr:
  enabled: true
  image: lscr.io/linuxserver/sonarr:latest
  port: 8989
  nodePort: 30989
  volumes:
    downloads: /downloads

# -- Bazarr (torrents namespace)
bazarr:
  enabled: true
  image: lscr.io/linuxserver/bazarr:latest
  port: 6767
  nodePort: 30767

# -- Prowlarr (torrents namespace)
prowlarr:
  enabled: true
  image: lscr.io/linuxserver/prowlarr:latest
  port: 9696
  nodePort: 30696

# -- Plex (media namespace)
plex:
  enabled: true
  image: lscr.io/linuxserver/plex:latest
  hostNetwork: true
  privileged: true

# -- Rustdesk (server namespace)
rustdesk:
  enabled: true
  image: rustdesk/rustdesk-server:latest
  hostNetwork: true

# -- Homepage (tools namespace)
homepage:
  enabled: true
  image: ghcr.io/gethomepage/homepage:latest
  port: 3000
  nodePort: 30300
  ip: 192.168.1.105
  services:
    - group: Torrents
      items:
        - name: qBittorrent
          icon: qbittorrent.png
          port: 30082
        - name: Radarr
          icon: radarr.png
          port: 30878
        - name: Sonarr
          icon: sonarr.png
          port: 30989
        - name: Bazarr
          icon: bazarr.png
          port: 30767
        - name: Prowlarr
          icon: prowlarr.png
          port: 30696
    - group: Media
      items:
        - name: Plex
          icon: plex.png
          port: 32400
          path: /web
    - group: Tools
      items:
        - name: IT-Tools
          icon: it-tools.png
          port: 30080
        - name: Stirling PDF
          icon: stirling-pdf.png
          port: 30880
        - name: Prometheus
          icon: prometheus.png
          port: 30090
        - name: Grafana
          icon: grafana.png
          port: 30030
        - name: Filegator
          icon: filegator.png
          port: 30808
        - name: Pairdrop
          icon: pairdrop.png
          port: 30303

# -- IT-Tools (tools namespace)
ittools:
  enabled: true
  image: corentinth/it-tools:latest
  port: 80
  nodePort: 30080

# -- Stirling PDF (tools namespace)
stirlingpdf:
  enabled: true
  image: stirlingtools/stirling-pdf:latest
  port: 8080
  nodePort: 30880

# -- Node Exporter (infra namespace)
nodeExporter:
  enabled: true
  image: prom/node-exporter:latest
  port: 9100

# -- Prometheus (infra namespace)
prometheus:
  enabled: true
  image: prom/prometheus:latest
  port: 9090
  nodePort: 30090
  retention: 30d

# -- Grafana (infra namespace)
grafana:
  enabled: true
  image: grafana/grafana:latest
  port: 3000
  nodePort: 30030

# -- Loki (monitoring namespace)
loki:
  enabled: true
  image: grafana/loki:latest
  port: 3100
  nodePort: 30310
  retention: 7d

# -- Promtail (monitoring namespace)
promtail:
  enabled: true
  image: grafana/promtail:latest
  port: 9080

# -- Filegator (tools namespace)
filegator:
  enabled: true
  image: filegator/filegator:latest
  port: 8080
  nodePort: 30808

# -- Pairdrop (tools namespace)
pairdrop:
  enabled: true
  image: linuxserver/pairdrop:latest
  port: 3000
  nodePort: 30303

# -- Samba (infra namespace)
samba:
  enabled: true
  image: dperson/samba:latest
  port: 445
