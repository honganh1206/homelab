# -- Global host path prefixes (centralized to avoid duplication)
paths:
  config: /home/hong/k8s-data
  seagate: /home/hong/Media/SeagateExpansion/Torrents
  westernDigital: /home/hong/Media/WesternDigital/Torrents

# -- Common environment variables for linuxserver images
linuxserver:
  puid: "1000"
  pgid: "1000"
  tz: "Etc/UTC"

# -- Namespace definitions
namespaces:
  - torrents
  - media
  - server
  - tools
  - infra

# -- qBittorrent (torrents namespace)
qbittorrent:
  enabled: true
  image: lscr.io/linuxserver/qbittorrent:4.6.7
  webuiPort: 8080
  nodePort: 30082
  torrentPort: 6881
  torrentNodePort: 30881
  volumes:
    downloads: /downloads
    media: /media

# -- Radarr (torrents namespace)
radarr:
  enabled: true
  image: lscr.io/linuxserver/radarr:latest
  port: 7878
  nodePort: 30878
  volumes:
    downloads: /downloads

# -- Sonarr (torrents namespace)
sonarr:
  enabled: true
  image: lscr.io/linuxserver/sonarr:latest
  port: 8989
  nodePort: 30989
  volumes:
    downloads: /downloads

# -- Bazarr (torrents namespace)
bazarr:
  enabled: true
  image: lscr.io/linuxserver/bazarr:latest
  port: 6767
  nodePort: 30767

# -- Plex (media namespace)
plex:
  enabled: true
  image: lscr.io/linuxserver/plex:latest
  hostNetwork: true
  privileged: true

# -- Rustdesk (server namespace)
rustdesk:
  enabled: true
  image: rustdesk/rustdesk-server:latest
  hostNetwork: true

# -- Homepage (tools namespace)
homepage:
  enabled: true
  image: ghcr.io/gethomepage/homepage:latest
  port: 3000
  nodePort: 30300
  ip: 192.168.1.105
  services:
    - group: Torrents
      items:
        - name: qBittorrent
          icon: qbittorrent.png
          port: 30082
        - name: Radarr
          icon: radarr.png
          port: 30878
        - name: Sonarr
          icon: sonarr.png
          port: 30989
        - name: Bazarr
          icon: bazarr.png
          port: 30767
    - group: Media
      items:
        - name: Plex
          icon: plex.png
          port: 32400
          path: /web
    - group: Tools
      items:
        - name: IT-Tools
          icon: it-tools.png
          port: 30080
    - group: Infra
      items:
        - name: Pi-hole
          icon: pi-hole.png
          port: 30053
          path: /admin

# -- IT-Tools (tools namespace)
ittools:
  enabled: true
  image: corentinth/it-tools:latest
  port: 80
  nodePort: 30080

# -- Pi-hole (infra namespace)
pihole:
  enabled: true
  image: pihole/pihole:latest
  webPort: 80
  webNodePort: 30053
  dnsPort: 53
  tz: "Etc/UTC"
  webPassword: "changeme"

# -- Samba (infra namespace)
samba:
  enabled: true
  image: dockurr/samba:latest
  port: 445
  nodePort: 30445
  shareName: "Media"
  user: "hong"
  password: "changeme"
  uid: "1000"
  gid: "1000"
