# -- Global host path prefixes (centralized to avoid duplication)
paths:
  config: /home/hong/k8s-data
  seagate: /home/hong/Media/SeagateExpansion/Torrents
  westernDigital: /home/hong/Media/WesternDigital/Torrents

# -- Common environment variables for linuxserver images
linuxserver:
  puid: "1000"
  pgid: "1000"
  tz: "Etc/UTC"

# -- Namespace definitions
namespaces:
  - torrents
  - media
  - server
  - tools
  - infra
  - monitoring

# -- qBittorrent (torrents namespace)
qbittorrent:
  enabled: true
  image: lscr.io/linuxserver/qbittorrent:4.6.7
  webuiPort: 8080
  nodePort: 30082
  torrentPort: 6881
  torrentNodePort: 30881
  volumes:
    downloads: /downloads
    media: /media

# -- Radarr (torrents namespace)
radarr:
  enabled: true
  image: lscr.io/linuxserver/radarr:latest
  port: 7878
  nodePort: 30878
  volumes:
    downloads: /downloads

# -- Sonarr (torrents namespace)
sonarr:
  enabled: true
  image: lscr.io/linuxserver/sonarr:latest
  port: 8989
  nodePort: 30989
  volumes:
    downloads: /downloads

# -- Bazarr (torrents namespace)
bazarr:
  enabled: true
  image: lscr.io/linuxserver/bazarr:latest
  port: 6767
  nodePort: 30767

# -- Prowlarr (torrents namespace)
prowlarr:
  enabled: true
  image: lscr.io/linuxserver/prowlarr:latest
  port: 9696
  nodePort: 30696

# -- Plex (media namespace)
plex:
  enabled: true
  image: lscr.io/linuxserver/plex:latest
  hostNetwork: true
  privileged: true

# -- Rustdesk (server namespace)
rustdesk:
  enabled: true
  image: rustdesk/rustdesk-server:latest
  hostNetwork: true

# -- Homepage (tools namespace)
homepage:
  enabled: true
  image: ghcr.io/gethomepage/homepage:latest
  port: 3000
  nodePort: 30300
  ip: 192.168.1.105
  services:
    - group: Torrents
      items:
        - name: qBittorrent
          icon: qbittorrent.png
          port: 30082
        - name: Radarr
          icon: radarr.png
          port: 30878
        - name: Sonarr
          icon: sonarr.png
          port: 30989
        - name: Bazarr
          icon: bazarr.png
          port: 30767
        - name: Prowlarr
          icon: prowlarr.png
          port: 30696
    - group: Media
      items:
        - name: Plex
          icon: plex.png
          port: 32400
          path: /web
    - group: Tools
      items:
        - name: IT-Tools
          icon: it-tools.png
          port: 30080
        - name: Prometheus
          icon: prometheus.png
          port: 30090
        - name: Grafana
          icon: grafana.png
          port: 30030
        - name: Keel
          icon: keel.png
          port: 30930
        - name: Filegator
          icon: filegator.png
          port: 30808
        - name: Pairdrop
          icon: pairdrop.png
          port: 30303
        - name: Headlamp
          icon: headlamp.png
          port: 30469
        - name: JobOps
          icon: mdi-briefcase-search
          port: 30005
        - name: Pi-hole
          icon: pi-hole.png
          port: 8053
    - group: Services
      items:
        - name: Uptime Kuma
          icon: uptime-kuma.png
          port: 30301
        - name: Speedtest Tracker
          icon: speedtest-tracker.png
          port: 30180
        - name: Ntfy
          icon: ntfy.png
          port: 30280
        - name: Vaultwarden
          icon: vaultwarden.png
          port: 30380
        - name: Immich
          icon: immich.png
          port: 30283

# -- IT-Tools (tools namespace)
ittools:
  enabled: true
  image: corentinth/it-tools:latest
  port: 80
  nodePort: 30080

# -- Node Exporter (infra namespace)
nodeExporter:
  enabled: true
  image: prom/node-exporter:latest
  port: 9100

# -- Prometheus (infra namespace)
prometheus:
  enabled: true
  image: prom/prometheus:latest
  port: 9090
  nodePort: 30090
  retention: 30d

# -- Grafana (infra namespace)
grafana:
  enabled: true
  image: grafana/grafana:latest
  port: 3000
  nodePort: 30030

# -- Loki (monitoring namespace)
loki:
  enabled: true
  image: grafana/loki:latest
  port: 3100
  nodePort: 30310
  retention: 7d

# -- Promtail (monitoring namespace)
promtail:
  enabled: true
  image: grafana/promtail:latest
  port: 9080

# -- Alertmanager (infra namespace)
alertmanager:
  enabled: true
  image: prom/alertmanager:latest
  port: 9093
  nodePort: 30903
  emailTo: "phamhonganhbackup@12062000@gmail.com"
  emailFrom: "alertmanager@homelab.local"
  smarthost: "smtp.gmail.com:587"

# -- Keel (infra namespace)
keel:
  enabled: true
  image: keelhq/keel:latest
  port: 9300
  nodePort: 30930
  pollSchedule: "@every 12h"
  adminUser: admin
  adminPassword: admin

# -- Filegator (tools namespace)
filegator:
  enabled: true
  image: filegator/filegator:latest
  port: 8080
  nodePort: 30808

# -- Pairdrop (tools namespace)
pairdrop:
  enabled: true
  image: linuxserver/pairdrop:latest
  port: 3000
  nodePort: 30303

# -- Dex OIDC provider (infra namespace)
dex:
  enabled: true
  image: ghcr.io/dexidp/dex:v2.41.1
  port: 5556
  nodePort: 30556
  issuer: http://192.168.1.105:30556/dex
  staticClient:
    id: headlamp
    secret: headlamp-secret
    name: Headlamp
    redirectURIs:
      - http://192.168.1.105:30469/oidc-callback
  staticPasswords:
    - email: admin@homelab.local
      # bcrypt hash of "admin" — change this!
      hash: "$2y$10$.BGmiBCm6Xr6xXDmmjgwxeh.Yym9p9TO.AHE41CIFSQfdNKZnHFuO"
      username: admin

# -- Headlamp (infra namespace)
headlamp:
  enabled: true
  image: ghcr.io/headlamp-k8s/headlamp:latest
  port: 4466
  servicePort: 80
  nodePort: 30469
  oidc:
    clientID: headlamp
    clientSecret: headlamp-secret
    issuerURL: http://192.168.1.105:30556/dex

# -- JobOps (tools namespace)
jobops:
  enabled: true
  image: ghcr.io/dakheera47/job-ops:latest
  port: 3001
  nodePort: 30005

# -- Pi-hole (infra namespace)
pihole:
  enabled: true
  image: pihole/pihole:latest
  webPort: 8053
  webPassword: "changeme"

# -- Immich (tools namespace)
immich:
  enabled: false
  image: ghcr.io/immich-app/immich-server:release
  mlImage: ghcr.io/immich-app/immich-machine-learning:release
  postgresImage: tensorchord/pgvecto-rs:pg16-v0.2.0
  redisImage: redis:7-alpine
  port: 2283
  nodePort: 30283
  dbPassword: "changeme"

# -- Caddy reverse proxy (tools namespace)
caddy:
  enabled: true
  image: caddy:2-alpine
  vaultwardenPort: 8443
  ntfyPort: 8444
  vaultwardenNodePort: 30443
  ntfyNodePort: 30444

# -- Samba (infra namespace)
samba:
  enabled: true
  image: dperson/samba:latest
  port: 445

# -- Uptime Kuma (tools namespace)
uptimeKuma:
  enabled: true
  image: louislam/uptime-kuma:latest
  port: 3001
  nodePort: 30301

# -- Speedtest Tracker (tools namespace)
speedtestTracker:
  enabled: true
  image: lscr.io/linuxserver/speedtest-tracker:latest
  port: 80
  nodePort: 30180
  appKey: "base64:changeme"
  schedule: "0 */6 * * *"
  appUrl: "http://192.168.1.105:30180"

# -- ntfy (tools namespace)
ntfy:
  enabled: true
  image: binwiederhier/ntfy:latest
  port: 80
  nodePort: 30280

# -- Vaultwarden (tools namespace)
vaultwarden:
  enabled: true
  image: vaultwarden/server:latest
  port: 80
  nodePort: 30380
