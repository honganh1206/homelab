{{- if .Values.n8n.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-postgres
  namespace: tools
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n-postgres
  template:
    metadata:
      labels:
        app: n8n-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.n8n.postgresImage }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.n8n.db.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.n8n.db.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.n8n.db.password | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.paths.config }}/tools/n8n/postgres
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-postgres
  namespace: tools
spec:
  selector:
    app: n8n-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
