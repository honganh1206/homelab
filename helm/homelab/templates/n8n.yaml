{{- if .Values.n8n.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: tools
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /home/node/.n8n /home/node/files"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: files
              mountPath: /home/node/files
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z n8n-postgres.tools.svc.cluster.local 5432; do echo 'waiting for postgres...'; sleep 3; done"]
        - name: create-minio-bucket
          image: minio/mc:latest
          command: ["sh", "-c"]
          args:
            - |
              mc alias set myminio http://minio.tools.svc.cluster.local:{{ .Values.minio.apiPort }} {{ .Values.minio.rootUser | quote }} {{ .Values.minio.rootPassword | quote }} &&
              mc mb --ignore-existing myminio/{{ .Values.n8n.s3.bucket }}
      containers:
        - name: n8n
          image: {{ .Values.n8n.image }}
          ports:
            - containerPort: {{ .Values.n8n.port }}
          env:
            - name: TZ
              value: {{ .Values.linuxserver.tz | quote }}
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: n8n-postgres.tools.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: {{ .Values.n8n.db.name | quote }}
            - name: DB_POSTGRESDB_USER
              value: {{ .Values.n8n.db.user | quote }}
            - name: DB_POSTGRESDB_PASSWORD
              value: {{ .Values.n8n.db.password | quote }}
            - name: N8N_EXTERNAL_STORAGE_S3_HOST
              value: minio.tools.svc.cluster.local
            - name: N8N_EXTERNAL_STORAGE_S3_PORT
              value: {{ .Values.minio.apiPort | quote }}
            - name: N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME
              value: {{ .Values.n8n.s3.bucket | quote }}
            - name: N8N_EXTERNAL_STORAGE_S3_ACCESS_KEY
              value: {{ .Values.minio.rootUser | quote }}
            - name: N8N_EXTERNAL_STORAGE_S3_ACCESS_SECRET
              value: {{ .Values.minio.rootPassword | quote }}
            - name: N8N_EXTERNAL_STORAGE_S3_PROTOCOL
              value: "http"
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "720"
            - name: N8N_SECURE_COOKIE
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: files
              mountPath: /home/node/files
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.paths.config }}/tools/n8n/data
        - name: files
          hostPath:
            path: {{ .Values.paths.config }}/tools/n8n/files
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: tools
spec:
  selector:
    app: n8n
  ports:
    - port: {{ .Values.n8n.port }}
      targetPort: {{ .Values.n8n.port }}
      nodePort: {{ .Values.n8n.nodePort }}
  type: NodePort
{{- end }}
