{{- if .Values.sonarr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: torrents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /config"]
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: sonarr
          image: {{ .Values.sonarr.image }}
          ports:
            - containerPort: {{ .Values.sonarr.port }}
          env:
            - name: PUID
              value: {{ .Values.linuxserver.puid | quote }}
            - name: PGID
              value: {{ .Values.linuxserver.pgid | quote }}
            - name: TZ
              value: {{ .Values.linuxserver.tz | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tvshows
              mountPath: /tv
            - name: tvshows-wd
              mountPath: /tv-wd
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          hostPath:
            path: {{ .Values.paths.config }}/torrents/sonarr/config
        - name: tvshows
          hostPath:
            path: {{ .Values.paths.seagate }}/Shows
        - name: tvshows-wd
          hostPath:
            path: {{ .Values.paths.westernDigital }}/Shows
        - name: downloads
          hostPath:
            path: {{ .Values.sonarr.volumes.downloads }}
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: torrents
spec:
  selector:
    app: sonarr
  ports:
    - port: {{ .Values.sonarr.port }}
      targetPort: {{ .Values.sonarr.port }}
      nodePort: {{ .Values.sonarr.nodePort }}
  type: NodePort
{{- end }}
