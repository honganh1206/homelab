{{- if .Values.samba.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      hostNetwork: true
      containers:
        - name: samba
          image: {{ .Values.samba.image }}
          args:
            - -p
            - -s
            - "Media;/storage;yes;no;yes"
          ports:
            - containerPort: {{ .Values.samba.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.samba.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: media-seagate
              mountPath: /storage/SeagateExpansion
            - name: media-wd
              mountPath: /storage/WesternDigital
            - name: config
              mountPath: /storage/Config
      volumes:
        - name: media-seagate
          hostPath:
            path: {{ .Values.paths.seagate }}
        - name: media-wd
          hostPath:
            path: {{ .Values.paths.westernDigital }}
        - name: config
          hostPath:
            path: {{ .Values.paths.config }}
{{- end }}
