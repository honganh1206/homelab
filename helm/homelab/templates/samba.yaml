{{- if .Values.samba.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: samba-config
  namespace: infra
data:
  smb.conf: |
    [global]
    workgroup = WORKGROUP
    server string = Homelab Samba
    security = user
    map to guest = Bad User
    guest account = nobody

    [Media]
    path = /storage
    browsable = yes
    read only = no
    guest ok = yes
    force user = root
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      hostNetwork: true
      containers:
        - name: samba
          image: {{ .Values.samba.image }}
          ports:
            - containerPort: {{ .Values.samba.port }}
          env:
            - name: UID
              value: {{ .Values.samba.uid | quote }}
            - name: GID
              value: {{ .Values.samba.gid | quote }}
          volumeMounts:
            - name: samba-conf
              mountPath: /etc/samba/smb.conf
              subPath: smb.conf
            - name: media-seagate
              mountPath: /storage/SeagateExpansion
            - name: media-wd
              mountPath: /storage/WesternDigital
            - name: config
              mountPath: /storage/Config
      volumes:
        - name: samba-conf
          configMap:
            name: samba-config
        - name: media-seagate
          hostPath:
            path: {{ .Values.paths.seagate }}
        - name: media-wd
          hostPath:
            path: {{ .Values.paths.westernDigital }}
        - name: config
          hostPath:
            path: {{ .Values.paths.config }}
{{- end }}
