{{- if .Values.headlamp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: infra
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-token
  namespace: infra
  annotations:
    kubernetes.io/service-account.name: headlamp
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: {{ .Values.headlamp.image }}
          args:
            - "-in-cluster"
            - "-plugins-dir=/headlamp/plugins"
            - "-token-ttl=0"
          ports:
            - containerPort: {{ .Values.headlamp.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: infra
spec:
  selector:
    app: headlamp
  ports:
    - port: {{ .Values.headlamp.servicePort }}
      targetPort: {{ .Values.headlamp.port }}
      nodePort: {{ .Values.headlamp.nodePort }}
  type: NodePort
{{- end }}
