{{- if .Values.homepage.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: tools
data:
  services.yaml: |
    {{- range .Values.homepage.services }}
    - {{ .group }}:
        {{- range .items }}
        - {{ .name }}:
            icon: {{ .icon }}
            href: http://{{ $.Values.homepage.ip }}:{{ .port }}{{ .path | default "" }}
            siteMonitor: http://{{ $.Values.homepage.ip }}:{{ .port }}{{ .path | default "" }}
        {{- end }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      initContainers:
        - name: copy-services
          image: busybox
          command: ["sh", "-c", "cp /configmap/services.yaml /config/services.yaml"]
          volumeMounts:
            - name: configmap
              mountPath: /configmap
            - name: config
              mountPath: /config
      containers:
        - name: homepage
          image: {{ .Values.homepage.image }}
          ports:
            - containerPort: {{ .Values.homepage.port }}
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          hostPath:
            path: {{ .Values.paths.config }}/tools/homepage/config
        - name: configmap
          configMap:
            name: homepage-config
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: tools
spec:
  selector:
    app: homepage
  ports:
    - port: {{ .Values.homepage.port }}
      targetPort: {{ .Values.homepage.port }}
      nodePort: {{ .Values.homepage.nodePort }}
  type: NodePort
{{- end }}
