{{- if .Values.pihole.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      hostNetwork: true
      containers:
        - name: pihole
          image: {{ .Values.pihole.image }}
          ports:
            - containerPort: {{ .Values.pihole.webPort }}
              name: web
            - containerPort: {{ .Values.pihole.dnsPort }}
              protocol: TCP
              name: dns-tcp
            - containerPort: {{ .Values.pihole.dnsPort }}
              protocol: UDP
              name: dns-udp
          env:
            - name: TZ
              value: {{ .Values.pihole.tz | quote }}
          volumeMounts:
            - name: pihole-config
              mountPath: /etc/pihole
            - name: dnsmasq-config
              mountPath: /etc/dnsmasq.d
      volumes:
        - name: pihole-config
          hostPath:
            path: {{ .Values.paths.config }}/infra/pihole/etc-pihole
        - name: dnsmasq-config
          hostPath:
            path: {{ .Values.paths.config }}/infra/pihole/etc-dnsmasq.d
{{- end }}
