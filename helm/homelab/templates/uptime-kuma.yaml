{{- if .Values.uptimeKuma.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: tools
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - name: uptime-kuma
          image: {{ .Values.uptimeKuma.image }}
          ports:
            - containerPort: {{ .Values.uptimeKuma.port }}
          env:
            - name: TZ
              value: {{ .Values.linuxserver.tz | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.uptimeKuma.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.paths.config }}/tools/uptime-kuma/data
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: tools
spec:
  selector:
    app: uptime-kuma
  ports:
    - port: {{ .Values.uptimeKuma.port }}
      targetPort: {{ .Values.uptimeKuma.port }}
      nodePort: {{ .Values.uptimeKuma.nodePort }}
  type: NodePort
{{- end }}
