{{- if .Values.rustdesk.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk-hbbr
  namespace: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustdesk-hbbr
  template:
    metadata:
      labels:
        app: rustdesk-hbbr
    spec:
      hostNetwork: {{ .Values.rustdesk.hostNetwork }}
      containers:
        - name: hbbr
          image: {{ .Values.rustdesk.image }}
          command: ["hbbr"]
          volumeMounts:
            - name: data
              mountPath: /root
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.paths.config }}/server/rustdesk/data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk-hbbs
  namespace: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustdesk-hbbs
  template:
    metadata:
      labels:
        app: rustdesk-hbbs
    spec:
      hostNetwork: {{ .Values.rustdesk.hostNetwork }}
      containers:
        - name: hbbs
          image: {{ .Values.rustdesk.image }}
          command: ["hbbs", "-r", "127.0.0.1:21117"]
          volumeMounts:
            - name: data
              mountPath: /root
      volumes:
        - name: data
          hostPath:
            path: {{ .Values.paths.config }}/server/rustdesk/data
{{- end }}
