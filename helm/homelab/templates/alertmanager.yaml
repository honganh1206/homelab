{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: infra
data:
  alertmanager.yml: |
    route:
      receiver: email
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: email
        email_configs:
          - to: {{ .Values.alertmanager.emailTo | quote }}
            from: {{ .Values.alertmanager.emailFrom | quote }}
            smarthost: {{ .Values.alertmanager.smarthost | quote }}
            auth_username: $(SMTP_USER)
            auth_password: $(SMTP_PASS)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      initContainers:
        - name: render-config
          image: busybox
          command: ["sh", "-c", "sed -e \"s/\\$(SMTP_USER)/$SMTP_USER/g\" -e \"s/\\$(SMTP_PASS)/$SMTP_PASS/g\" /configmap/alertmanager.yml > /config/alertmanager.yml"]
          env:
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: alertmanager-smtp
                  key: auth_username
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: alertmanager-smtp
                  key: auth_password
          volumeMounts:
            - name: configmap
              mountPath: /configmap
            - name: config
              mountPath: /config
      containers:
        - name: alertmanager
          image: {{ .Values.alertmanager.image }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          ports:
            - containerPort: {{ .Values.alertmanager.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: configmap
          configMap:
            name: alertmanager-config
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: infra
spec:
  selector:
    app: alertmanager
  ports:
    - port: {{ .Values.alertmanager.port }}
      targetPort: {{ .Values.alertmanager.port }}
      nodePort: {{ .Values.alertmanager.nodePort }}
  type: NodePort
{{- end }}
