{{- if .Values.qbittorrent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: torrents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /config"]
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: qbittorrent
          image: {{ .Values.qbittorrent.image }}
          ports:
            - containerPort: {{ .Values.qbittorrent.webuiPort }}
            - containerPort: {{ .Values.qbittorrent.torrentPort }}
              protocol: TCP
            - containerPort: {{ .Values.qbittorrent.torrentPort }}
              protocol: UDP
          env:
            - name: PUID
              value: {{ .Values.linuxserver.puid | quote }}
            - name: PGID
              value: {{ .Values.linuxserver.pgid | quote }}
            - name: TZ
              value: {{ .Values.linuxserver.tz | quote }}
            - name: WEBUI_PORT
              value: {{ .Values.qbittorrent.webuiPort | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.qbittorrent.webuiPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: media
              mountPath: /media
      volumes:
        - name: config
          hostPath:
            path: {{ .Values.paths.config }}/torrents/qbittorrent/config
            type: DirectoryOrCreate
        - name: downloads
          hostPath:
            path: {{ .Values.qbittorrent.volumes.downloads }}
        - name: media
          hostPath:
            path: {{ .Values.qbittorrent.volumes.media }}
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: torrents
spec:
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: {{ .Values.qbittorrent.webuiPort }}
      targetPort: {{ .Values.qbittorrent.webuiPort }}
      nodePort: {{ .Values.qbittorrent.nodePort }}
    - name: torrent-tcp
      port: {{ .Values.qbittorrent.torrentPort }}
      targetPort: {{ .Values.qbittorrent.torrentPort }}
      protocol: TCP
      nodePort: {{ .Values.qbittorrent.torrentNodePort }}
    - name: torrent-udp
      port: {{ .Values.qbittorrent.torrentPort }}
      targetPort: {{ .Values.qbittorrent.torrentPort }}
      protocol: UDP
      nodePort: {{ .Values.qbittorrent.torrentNodePort }}
  type: NodePort
{{- end }}
