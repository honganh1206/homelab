# Kube State Metrics deployment in a regular pod
apiVersion: apps/v1
kind: Deployment

metadata:
  name: agent-kube-state-metrics
spec:
  replicas: 1
  template:
    spec:
      serviceAccountName: agent-kube-state-metrics
      automountServiceAccountToken: true
      containers:
        - name: agent
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: # Add/drop security-related capabilities to the container
              drop:
                - ALL # Get a non-privileged container
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: # Restrict calls from user space to kernel
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http-metrics
            - containerPort: 8081
              name: telemetry
          resources:
            requests:
              cpu: 250m
              memory: 32M
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
      nodeSelector: # Run only on nodes that have this label
        kubernetes.io/os: linux
      tolerations:
        # Tolerate the server node taint so this pod will run on server node
        - effect: NoSchedule
          operator: Exists
