# Prometheus Node Exporter DaemonSet for a regular pod
apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: agent-prometheus-node-exporter
spec:
  template:
    spec:
      containers:
        - name: metrics
          image: prom/node-exporter:v1.10.2
          args:
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --no-collector.hwmon # NOT collect hardware and sensor data
            - --no-collector.wifi # NOT collect stats from wifi interface
            - --collector.filesystem.ignored-mount-points=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)
            - --collector.netclass.ignored-devices=^(veth.*)$
          ports:
            - containerPort: 9100
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: 102m
              memory: 180Mi
          volumeMounts:
            - mountPath: /host/sys
              mountPropagation: HostToContainer
              name: sys
              readOnly: true
            - mountPath: /host/root
              mountPropagation: HostToContainer
              name: root
              readOnly: true
      volumes:
        - hostPath:
            path: /sys
          name: sys
        - hostPath:
            path: /
          name: root
      tolerations:
        # Pod goes to server node
        - effect: NoSchedule
          operator: Exists
