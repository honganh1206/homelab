# Ghost Valkey headless service
apiVersion: v1
kind: Service

metadata:
  name: cache-valkey
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
spec:
  type: ClusterIP # Default of Service, reachable only within the cluster's internal network
  clusterIP: None # StatefulSets are limited to use headless service
  ports:
    - port: 6379
      targetPort: server
      protocol: TCP
      name: server # Link to StatefulSet DB resource
    - port: 9121
      targetPort: metrics
      protocol: TCP
      name: metrics # Link to sidecar exporter
