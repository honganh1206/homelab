# Persistent storage volume for the Ghost server
apiVersion: v1
kind: PersistentVolume

metadata:
  name: ghost-ssd-srv
spec:
  capacity:
    storage: 2.3G
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/ghost-ssd/srv/k3smnt
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3sagent02
