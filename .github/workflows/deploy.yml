name: Deploy to K3s

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Helm
        run: helm upgrade --install homelab helm/homelab --create-namespace

      - name: Verify pods
        run: |
          echo "Waiting for pods to be ready..."
          sleep 10
          kubectl get pods -A
