name: Deploy to K3s

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Apply namespaces
        run: kubectl apply -f k8s/namespaces.yaml

      - name: Deploy server services
        run: kubectl apply -f k8s/server/

      - name: Create qBittorrent ConfigMap
        run: |
          kubectl create configmap qbittorrent-config \
            --from-file=qBittorrent.conf=k8s/torrents/qbit-config.conf \
            -n torrents --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy torrent services
        run: kubectl apply -f k8s/torrents/

      - name: Deploy media services
        run: kubectl apply -f k8s/media/

      - name: Verify pods
        run: |
          echo "Waiting for pods to be ready..."
          sleep 10
          kubectl get pods -A
