apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-init
  namespace: torrents
data:
  apply-config.sh: |
    #!/usr/bin/with-contenv bash
    # Copy the custom config into place on every container start
    CONF_DIR="/config/qBittorrent"
    mkdir -p "$CONF_DIR"
    cp /custom-cont-init.d/qBittorrent.conf "$CONF_DIR/qBittorrent.conf"
    echo "[apply-config] Copied custom qBittorrent.conf"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-config
  namespace: torrents
data:
  qBittorrent.conf: |
    [Application]
    FileLogger\Age=1
    FileLogger\AgeType=1
    FileLogger\Backup=true
    FileLogger\DeleteOld=true
    FileLogger\Enabled=true
    FileLogger\MaxSizeBytes=66560
    FileLogger\Path=/config/qBittorrent/logs

    [AutoRun]
    enabled=false
    program=

    [BitTorrent]
    Session\DefaultSavePath=/downloads/
    Session\DisableAutoTMMByDefault=false
    Session\DisableAutoTMMTriggers\CategorySavePathChanged=false
    Session\DisableAutoTMMTriggers\DefaultSavePathChanged=false
    Session\ExcludedFileNames=
    Session\GlobalMaxInactiveSeedingMinutes=120
    Session\GlobalMaxRatio=1
    Session\GlobalMaxSeedingMinutes=60
    Session\Port=6881
    Session\Preallocation=true
    Session\QueueingSystemEnabled=true
    Session\TempPath=/downloads/incomplete/
    Session\TempPathEnabled=true
    Session\TorrentContentLayout=Subfolder

    [Core]
    AutoDeleteAddedTorrentFile=IfAdded

    [LegalNotice]
    Accepted=true

    [Meta]
    MigrationVersion=6

    [Network]
    Cookies=@Invalid()
    PortForwardingEnabled=false
    Proxy\HostnameLookupEnabled=false
    Proxy\Profiles\BitTorrent=true
    Proxy\Profiles\Misc=true
    Proxy\Profiles\RSS=true

    [Preferences]
    Connection\PortRangeMin=6881
    Connection\UPnP=false
    Downloads\SavePath=/downloads/
    Downloads\TempPath=/downloads/incomplete/
    General\Locale=en
    MailNotification\req_auth=true
    WebUI\Address=*
    WebUI\AuthSubnetWhitelist=192.168.2.0/24, 172.21.0.0/16
    WebUI\AuthSubnetWhitelistEnabled=true
    WebUI\LocalHostAuth=false
    WebUI\Password_PBKDF2="@ByteArray(wCp11AxcqNlhcnksrEGW7Q==:vKumZG8K1JRVIjRth2ydAs7wj5avZED7EgNhxo4G0UBBH1iuVfLJXMDSBz/w/1QXWlHl4rz/Vt6zJYDLrUMgWA==)"
    WebUI\Port=8080
    WebUI\ServerDomains=*

    [RSS]
    AutoDownloader\DownloadRepacks=true
    AutoDownloader\SmartEpisodeFilter=s(\\d+)e(\\d+), (\\d+)x(\\d+), "(\\d{4}[.\\-]\\d{1,2}[.\\-]\\d{1,2})", "(\\d{1,2}[.\\-]\\d{1,2}[.\\-]\\d{4})"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: torrents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          ports:
            - containerPort: 8080
            - containerPort: 6881
              protocol: TCP
            - containerPort: 6881
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            - name: WEBUI_PORT
              value: "8080"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: media
              mountPath: /media
            - name: init-scripts
              mountPath: /custom-cont-init.d/apply-config.sh
              subPath: apply-config.sh
            - name: qbit-config
              mountPath: /custom-cont-init.d/qBittorrent.conf
              subPath: qBittorrent.conf
      volumes:
        - name: config
          hostPath:
            path: /home/hong/k8s-data/torrents/qbittorrent/config
        - name: downloads
          hostPath:
            path: /downloads
        - name: media
          hostPath:
            path: /media
        - name: init-scripts
          configMap:
            name: qbittorrent-init
            defaultMode: 0755
        - name: qbit-config
          configMap:
            name: qbittorrent-config
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: torrents
spec:
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: 8080
      nodePort: 30082
    - name: torrent-tcp
      port: 6881
      targetPort: 6881
      protocol: TCP
      nodePort: 30881
    - name: torrent-udp
      port: 6881
      targetPort: 6881
      protocol: UDP
      nodePort: 30881
  type: NodePort
