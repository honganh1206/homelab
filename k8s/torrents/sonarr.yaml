apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: torrents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          ports:
            - containerPort: 8989
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tvshows
              mountPath: /tv
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: config
          hostPath:
            path: /home/hong/k8s-data/torrents/sonarr/config
        - name: tvshows
          hostPath:
            path: /home/hong/Media/SeagateExpansion/Torrents/Shows
        - name: downloads
          hostPath:
            path: /downloads
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: torrents
spec:
  selector:
    app: sonarr
  ports:
    - port: 8989
      targetPort: 8989
      nodePort: 30989
  type: NodePort
