version: "3.7"

networks:
    dns_net:
        driver: bridge
        ipam:
            config:
                - subnet: 172.23.0.0/16
    proxy:
        external: true

# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
    nginx-proxy-manager:
        image: "jc21/nginx-proxy-manager:latest"
        ports:
            - "80:80"
            - "81:81"
            - "443:443"
            # Uncomment the next line if you uncomment anything in the section
        # environment:
        # Uncomment this if you want to change the location of
        # the SQLite DB file within the container
        # DB_SQLITE_FILE: "../../assets/networking/nginx-proxy-manager/data/database.sqlite"

        # Uncomment this if IPv6 is not enabled on your host
        # DISABLE_IPV6: 'true'
        volumes:
            - ../../assets/networking/nginx-proxy-manager/data:/data
            - ../../assets/networking/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
        restart: unless-stopped
    pihole:
        container_name: pihole
        image: pihole/pihole:latest
        # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
        networks:
            dns_net:
                ipv4_address: 172.23.0.7
        ports:
            - "53:53/tcp"
            - "53:53/udp"
            # - "67:67/udp" # Only required if you are using Pi-hole as your DHCP server
            - "85:80/tcp"
        environment:
            TZ: "Etc/UTC"
            WEBPASSWORD: "SECUREPASSWORD"
            # Traffic will be redirected to unbound here
            PIHOLE_DNS_: 172.23.0.8#5053
        # Volumes store your data between container upgrades
        volumes:
            - "../../assets/networking/nginx-proxy-manager/pihole/etc-pihole:/etc/pihole"
            - "../../assets/networking/nginx-proxy-manager/pihole/etc-dnsmasq.d:/etc/dnsmasq.d"
        #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
        # cap_add:
        #     - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
        restart: unless-stopped
    unbound:
        container_name: unbound
        image: mvance/unbound:latest
        networks:
            dns_net:
                ipv4_address: 172.23.0.8
        volumes:
            - "../../assets/networking/unbound:/opt/unbound/etc/unbound"
        ports:
            - "5053:53/tcp"
            - "5053:53/udp"
        restart: unless-stopped
    tailscale:
        image: tailscale/tailscale:latest
        container_name: tailscale
        hostname: honganh-homelab-docker-installation
        environment:
            - TS_AUTHKEY=${SERVER_TAILSCALE_AUTHKEY}
            # - TS_EXTRA_ARGS=--advertise-tags=tag:container
            - TS_STATE_DIR=/var/lib/tailscale
        volumes:
            - ../../assets/networking/tailscale/state:/var/lib/tailscale # State data will be stored in this directory
            - /dev/net/tun:/dev/net/tun
        cap_add:
            - net_admin
            - sys_module
        # command: tailscaled
        privileged: true
        restart: unless-stopped
    caddy:
        image: caddy:latest
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ../../assets/networking/caddy/Caddyfile:/etc/caddy/Caddyfile
            - ../../assets/networking/caddy/site:/srv
            - caddy_data:/data
            - caddy_config:/config

volumes:
    caddy_data:
    caddy_config:
