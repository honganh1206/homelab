version: "3.7"

# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
    pihole:
        container_name: pihole
        image: pihole/pihole:latest
        # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
        ports:
            - "53:53/tcp"
            - "53:53/udp"
            - "67:67/udp" # Only required if you are using Pi-hole as your DHCP server
            - '8053:80/tcp'
        # Volumes store your data between container upgrades
        volumes:
            - "../../assets/networking/pihole/etc-pihole:/etc/pihole"
            - "../../assets/networking/pihole/etc-dnsmasq.d:/etc/dnsmasq.d"
        # run `touch ./var-log/pihole.log` first unless you like errors
      # - './var-log/pihole.log:/var/log/pihole/pihole.log'
    # Recommended but not required (DHCP needs NET_ADMIN)
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
        cap_add:
            - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
        environment:
          FTLCONF_LOCAL_IPV4: 192.168.41.55
          PROXY_LOCATION: pihole
          VIRTUAL_HOST: pihole.yourDomain.lan
          VIRTUAL_PORT: 80
        extra_hosts:
          # Resolve to nothing domains (terminate connection)
          - 'nw2master.bioware.com nwn2.master.gamespy.com:0.0.0.0'
          # LAN hostnames for other docker containers using nginx-proxy
          - 'yourDomain.lan:192.168.41.55'
          - 'pihole pihole.yourDomain.lan:192.168.41.55'
          - 'ghost ghost.yourDomain.lan:192.168.41.55'
          - 'wordpress wordpress.yourDomain.lan:192.168.41.55'
        restart: always
    nginx-proxy:
        image: nginxproxy/nginx-proxy
        ports:
            - "80:80"
        environment:
            DEFAULT_HOST: pihole.yourDomain.lan
        volumes:
            - "/var/run/docker.sock:/tmp/docker.sock"
        restart: always
    tailscale:
        image: tailscale/tailscale:latest
        container_name: tailscale
        hostname: honganh-homelab-docker-installation
        environment:
            - TS_AUTHKEY=${SERVER_TAILSCALE_AUTHKEY}
            # - TS_EXTRA_ARGS=--advertise-tags=tag:container
            - TS_STATE_DIR=/var/lib/tailscale
        volumes:
            - ../../assets/networking/tailscale/state:/var/lib/tailscale # State data will be stored in this directory
            - /dev/net/tun:/dev/net/tun
        cap_add:
            - net_admin
            - sys_module
        # command: tailscaled
        privileged: true
        restart: unless-stopped
