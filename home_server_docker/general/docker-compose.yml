version: "3.7"
services:
    watchtower:
        image: containrrr/watchtower
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
    home_assistant:
        container_name: home_assistant
        image: "ghcr.io/home-assistant/home-assistant:stable"
        volumes:
            - ../../assets/general/home_assistant/config:/config
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
        restart: unless-stopped
        privileged: true
        network_mode: host
    # Seafile and other dependencies
    db:
        image: mariadb:10.11
        container_name: seafile-mysql
        env_file:
            - path: ./general.env
            - reuqired: true
        environment:
            - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_MYSQL_ROOT_PASSWORD} # Requested, set the root's password of MySQL service.
            - MYSQL_LOG_CONSOLE=true
            - MARIADB_AUTO_UPGRADE=1
        volumes:
            - ../../assets/general/seafile/mysql/db:/var/lib/mysql # Requested, specifies the path to MySQL data persistent store.
        networks:
            - seafile-net
    memcached:
        image: memcached:1.6.18
        container_name: seafile-memcached
        entrypoint: memcached -m 256
        networks:
            - seafile-net
    seafile:
        image: seafileltd/seafile-mc:latest
        container_name: seafile
        ports:
            - "80:80"
        #     - "443:443"  # If https is enabled, cancel the comment.
        volumes:
            - ../../assets/general/seafile/data:/shared # Requested, specifies the path to Seafile data persistent store.
        env_file:
            - path: ./general.env
            - required: true
        environment:
            - DB_HOST=db
            - DB_ROOT_PASSWD=${SEAFILE_DB_MYSQL_ROOT_PASSWORD} # Requested, the value should be root's password of MySQL service.
            - TIME_ZONE=Etc/UTC # Optional, default is UTC. Should be uncomment and set to your local time zone.
            - SEAFILE_ADMIN_EMAIL=${SEAFILE_HOMESERVER_ADMIN_EMAIL} # Specifies Seafile admin user, default is 'me@example.com'.
            - SEAFILE_ADMIN_PASSWORD=${SEAFILE_HOMESERVER_ADMIN_PASSWORD} # Specifies Seafile admin password, default is 'asecret'.
            - SEAFILE_SERVER_LETSENCRYPT=false # Whether to use https or not.
            - SEAFILE_SERVER_HOSTNAME=docs.seafile.com # Specifies your host name if https is enabled.
        depends_on:
            - db
            - memcached
        networks:
            - seafile-net

networks:
    seafile-net:
