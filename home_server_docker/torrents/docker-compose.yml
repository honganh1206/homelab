version: "3.7"
services:
    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:latest
        container_name: qbittorrent
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
            - WEBUI_PORT=8082
        volumes:
            - ../../assets/torrents/qbit/config:/config
            - /downloads:/downloads
            - /media:/media
        ports:
            - 8082:8082
            - 6881:6881
            - 6881:6881/udp
        restart: unless-stopped
    flood:
        image: jesec/flood:latest
        container_name: flood
        restart: always
        depends_on:
            - qbittorrent
        user: 1000:1000
        env_file:
            - torrents.env
        volumes:
            - ../../aseets/torrents/flood/config:/config
            - /downloads:/downloads
            - /home/hong/Media/SeagateExpansion/Torrents:/media
            - /etc/localtime:/etc/localtime:ro
        ports:
            - 3001:3001
        command:
            - --auth=none
            - --qburl=http://192.168.1.105:8082
            - --qbuser=QBIT_USERNAME
            - --qbpass=QBIT_PASSWORD
    bazarr:
        image: lscr.io/linuxserver/bazarr:latest
        container_name: bazarr
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
        volumes:
            - ../../assets/torrents/bazarr/config:/config
            - /home/hong/Media/WesternDigital/Torrents/Movies:/movies
            - /home/hong/Media/WesternDigital/Torrents/TV_Shows:/tv
            - /home/hong/Media/SeagateExpansion/Torrents/Movies:/movies
            - /home/hong/Media/SeagateExpansion/Torrents/Shows:/tv
        ports:
            - 6767:6767
        restart: unless-stopped
    # Manage your qBittorrent instance and Arr instances
    # qbitrr:
    #   image: feramance/qbitrr:latest
    #   user: 1000:1000 # Required to ensure the container is run as the user who has perms to see the 2 mount points and the ability to write to the CompletedDownloadFolder mount
    #   tty: true # Ensure the output of docker-compose logs qBitrr are properly colored.
    #   restart: unless-stopped
    #   # networks: This container MUST share a network with your Sonarr/Radarr instances
    #   environment:
    #     - TZ=Europe/London
    #   volumes:
    #     - /etc/localtime:/etc/localtime:ro
    #     - /path/to/appdata/qbitrr:/config  # Config folder for qBitrr
