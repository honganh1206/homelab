    kometa:
        image: lscr.io/linuxserver/kometa:latest
        container_name: kometa
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
            # - KOMETA_CONFIG=/config/config.yml #optional
            # - KOMETA_TIME=03:00 #optional
            # - KOMETA_RUN=False #optional
            # - KOMETA_TEST=False #optional
            # - KOMETA_NO_MISSING=False #optional
        volumes:
            - ../../assets/media/kometa/config:/config
        restart: unless-stopped
    jellyfin:
        image: lscr.io/linuxserver/jellyfin:latest
        container_name: root-jellyfin
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
            # - JELLYFIN_PublishedServerUrl=192.168.1.105 #optional
        volumes:
            - ../../assets/media/jellyfin/config:/config/jellyfin
            - /home/hong/Media/SeagateExpansion/Torrents/Shows:/data/tvshows
            - /home/hong/Media/SeagateExpansion/Torrents/Movies:/data/movies
        ports:
            - 8096:8096
            # - 8920:8920 #optional
            # - 7359:7359/udp #optional
            # - 1900:1900/udp #optional
        restart: unless-stopped
