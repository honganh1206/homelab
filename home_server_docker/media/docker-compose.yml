    plex-meta-manager:
        image: meisnate12/plex-meta-manager # lscr.io/linuxserver/plex-meta-manager:latest
        command: python plex-meta-manager.py -r # start python script to load metadata overlay
        container_name: plex-meta-manager
        # extra_hosts:
        # - "host.docker.internal:host-gateway"
        # user: "${PUID}:${PGID}"
        environment:
            - TZ=TIMEZONE #optional
        # - PUID=${PUID}
        # - PGID=${PGID}
        # - PMM_CONFIG=/config/config.yml #optional
        # - PMM_TIME=03:00 #optional
        # - PMM_RUN=False #optional
        # - PMM_TEST=False #optional
        # - PMM_NO_MISSING=False #optional
        volumes:
            - ../../assets/media/plex-meta-manager/config:/config
        restart: unless-stopped
    letterboxd-list-radarr:
        image: screeny05/letterboxd-list-radarr:latest
        ports:
            - 5000:5000
        environment:
            - REDIS_URL=redis://redis:6379
        depends_on:
            - redis
    redis:
        image: redis:6.0
    jellyfin:
        image: lscr.io/linuxserver/jellyfin:latest
        container_name: root-jellyfin
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
            # - JELLYFIN_PublishedServerUrl=192.168.1.105 #optional
        volumes:
            - ../../assets/media/jellyfin/config:/config/jellyfin
            - /media/hong/WesternDigital/Torrents/TV_Shows:/data/tvshows
            - /media/hong/WesternDigital/Torrents/Movies:/data/movies
            - /media/hong/SeagateExpansion/Torrents/TV_Shows:/data/tvshows
            - /media/hong/SeagateExpansion/Torrents/Movies:/data/movies
        ports:
            - 8096:8096
            # - 8920:8920 #optional
            # - 7359:7359/udp #optional
            # - 1900:1900/udp #optional
        restart: unless-stopped
