# Home server
version: '3.7'
services:
  # Dashboard for all apps
  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    volumes:
      - ../assets/homarr/configs:/app/data/configs
      - ../assets/homarr/data:/data
      - ../assets/homarr/icons:/app/public/icons
    ports:
      - '7575:7575'
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  # Transcoding
  # tdarr:
  #   container_name: tdarr
  #   image: ghcr.io/haveagitgat/tdarr:latest
  #   restart: unless-stopped
  #   network_mode: bridge
  #   ports:
  #     - 8265:8265 # webUI port
  #     - 8266:8266 # server port
  #   environment:
  #     - TZ=Europe/London
  #     - PUID=1000
  #     - PGID=1000
  #     - UMASK_SET=002
  #     - serverIP=0.0.0.0
  #     - serverPort=8266
  #     - webUIPort=8265
  #     - internalNode=true
  #     - inContainer=true
  #     - nodeName=MyInternalNode
  #   volumes:
  #     - /docker/tdarr/server:/app/server
  #     - /docker/tdarr/configs:/app/configs
  #     - /docker/tdarr/logs:/app/logs
  #     - /media:/media/hong/
  #     - /transcode_cache:/temp
  # tdarr-node:
  #   container_name: tdarr-node
  #   image: ghcr.io/haveagitgat/tdarr_node:latest
  #   restart: unless-stopped
  #   network_mode: service:tdarr
  #   environment:
  #     - TZ=Europe/London
  #     - PUID=1000
  #     - PGID=1000
  #     - UMASK_SET=002
  #     - serverIP=0.0.0.0
  #     - serverPort=8266
  #     - inContainer=true
  #   volumes:
  #     - /docker/tdarr/configs:/app/configs
  #     - /docker/tdarr/logs:/app/logs
  #     - /media:/media/hong/
  #     - /transcode_cache:/temp
  # Managing subtitles
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:  
      - ../assets/bazarr/config:/config
      - /media/hong/My Passport1/Movies:/movies
      - /media/hong/My Passport1/TV_Shows:/tv
    ports:
      - 6767:6767
    restart: unless-stopped
  # Rustdesk remote server
  hbbs:
    container_name: hbbs
    # ports:
    #   - 21115:21115
    #   - 21116:21116
    #   - 21116:21116/udp
    #   - 21118:21118
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r 127.0.0.1:21117
    volumes:
      - ./data:/root
    network_mode: "host"

    depends_on:
      - hbbr
    restart: unless-stopped
  hbbr:
    container_name: hbbr
    # ports:
    #   - 21117:21117
    #   - 21119:21119
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: "host"
    restart: unless-stopped
  plex-meta-manager:
    image: meisnate12/plex-meta-manager # lscr.io/linuxserver/plex-meta-manager:latest
    command: python plex-meta-manager.py -r # start python script to load metadata overlay
    container_name: plex-meta-manager
    # extra_hosts:
    # - "host.docker.internal:host-gateway"
    # user: "${PUID}:${PGID}"
    environment:
      - TZ=TIMEZONE #optional
    # - PUID=${PUID}
    # - PGID=${PGID}
    # - PMM_CONFIG=/config/config.yml #optional
    # - PMM_TIME=03:00 #optional
    # - PMM_RUN=False #optional
    # - PMM_TEST=False #optional
    # - PMM_NO_MISSING=False #optional
    volumes:
    - ../assets/plex-meta-manager/config:/config
    restart: unless-stopped
  letterboxd-list-radarr:
        image: screeny05/letterboxd-list-radarr:latest
        ports:
            - 5000:5000
        environment:
            - REDIS_URL=redis://redis:6379
        depends_on:
            - redis
  redis:
      image: redis:6.0
  jellyfin:
      image: lscr.io/linuxserver/jellyfin:latest
      container_name: root-jellyfin
      environment:
          - PUID=1000
          - PGID=1000
          - TZ=Etc/UTC
          # - JELLYFIN_PublishedServerUrl=192.168.1.105 #optional
      volumes:
          - ../assets/jellyfin/config:/config/jellyfin
          - /media/hong/My Passport1/TV_Shows:/data/tvshows
          - /media/hong/My Passport1/Movies:/data/movies
      ports:
          - 8096:8096
          # - 8920:8920 #optional
          # - 7359:7359/udp #optional
          # - 1900:1900/udp #optional
      restart: unless-stopped
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CLI_ARGS= #optional
    volumes:
      - ../assets/config:/config
      - /media/hong/My Passport1/Backup:/backups
      - /media/hong/My Passport1:/source
    ports:
      - 8200:8200
    restart: unless-stopped
  samba:
    image: dperson/samba
    env_file: 
      - .env
    environment:
      - TZ='Asia/Ho_Chi_Minh'
      - SHARE=Data;/mnt;yes;no;no;hong;none;none;Data
      - SHARE=HomeServer;/mnt2;yes;no;no;hong;none;none;HomeServer
      - WORKGROUP=workgroup
      - USER=SERVER_USERNAME;SERVER_PASSWORD
      - NMBD=True
    networks:
      - default
    ports:
      - "137:137/udp"
      - "138:138/udp"
      - "139:139/tcp"
      - "445:445/tcp"
    read_only: false
    tmpfs:
      - /tmp
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - /media/hong/My Passport1:/mnt:z
      - /home:/mnt2:x
networks:
  default: