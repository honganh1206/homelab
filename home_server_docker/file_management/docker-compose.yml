version: "3.7"

services:
    db:
        image: mariadb:10.6
        restart: always
        command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
        volumes:
            - ../../assets/file_management/nextclouddb:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=dbpassword
            - MYSQL_PASSWORD=dbpassword
            - MYSQL_DATABASE=nextcloud
            - MYSQL_USER=nextcloud
    app:
        image: nextcloud
        restart: always
        ports:
            - 8081:80
        links:
            - db
        volumes:
            - ../../assets/file_management/nextcloud:/var/www/html
        environment:
            - MYSQL_PASSWORD=dbpassword
            - MYSQL_DATABASE=nextcloud
            - MYSQL_USER=nextcloud
            - MYSQL_HOST=db
