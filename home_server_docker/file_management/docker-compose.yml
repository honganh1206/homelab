version: "3.7"

services:
    nextcloud:
        image: lscr.io/linuxserver/nextcloud
        container_name: nextcloud
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/London
        volumes:
            - ../../assets/file_management/nextcloud/config:/config
            - ../../assets/file_management/nextcloud/data:/data
        depends_on:
            - mariadb
        restart: unless-stopped
    mariadb:
        image: lscr.io/linuxserver/mariadb
        container_name: mariadb
        environment:
            - PUID=1000
            - PGID=1000
            - MYSQL_ROOT_PASSWORD=mariadbpassword
            - TZ=Europe/London
            - MYSQL_DATABASE=nextcloud
            - MYSQL_USER=ncuser
            - MYSQL_PASSWORD=ncpassword
        volumes:
            - ../../assets/file_management/mariadb:/config
        restart: unless-stopped
    swag:
        image: lscr.io/linuxserver/swag
        container_name: swag
        cap_add:
            - NET_ADMIN
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/London
            - URL=linuxserver-test.duckdns.org
            - SUBDOMAINS=wildcard
            - VALIDATION=duckdns
            - DUCKDNSTOKEN=97654867496t0877648659765854
        volumes:
            - ../../assets/file_management/swag:/config
        ports:
            - 443:443
            - 80:80
        restart: unless-stopped
